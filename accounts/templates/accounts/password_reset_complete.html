<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css" />

    <style>
        :root {
            --primary-color: #4e73df;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-wrapper img {
            height: 120px;
            width: auto;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.1));
            transition: transform 0.3s ease;
        }

        .logo-wrapper img:hover {
            transform: scale(1.05);
        }

        .form-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Django Form Styling */
        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }

        form input[type="email"],
        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
        }

        form input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(78, 115, 223, 0.1);
        }

        /* Error List Styling */
        .errorlist {
            color: #dc3545;
            list-style: none;
            padding: 0;
            font-size: 13px;
            margin-top: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #3751a1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.3);
        }

        .footer-text {
            font-size: 12px;
            margin-top: 30px;
            text-align: center;
            color: #888;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="logo-wrapper">
            <a href="{% url 'index' %}">
                <img src="{% static 'images/SHOP.jpg' %}" alt="MyShop Logo">
            </a>
        </div>

        <div class="form-card">
            <h1>Password Reset Completed 🎉</h1>
            <p>You can go to the login page from here:</p>
            <a href="{% url 'log_in' %}" class="back-link">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                <p class="footer-text">
                    &copy; 2026 MyShop. All rights reserved by Sujan Sapkota
                </p>
            </a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>

</body>

</html>
