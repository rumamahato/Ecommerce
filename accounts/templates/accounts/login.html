<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Alertify CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

    <style>
        :root {
            --primary-color: #4e73df;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .logo-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .logo-wrapper img {
            height: 80px;
        }

        .form-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
        }

        .password-wrapper i {
            position: absolute;
            right: 15px;
            top: 15px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .social-btn {
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .google { background: #ea4335; }
        .github { background: #333; }
        .facebook { background: #1877f2; }
    </style>
</head>

<body>

<div class="logo-wrapper">
    <a href="{% url 'index' %}">
        <img src="{% static 'images/SHOP.jpg' %}" alt="Logo">
    </a>
</div>

<div class="login-container">
    <div class="form-card">
        <form method="POST" action="{% url 'log_in' %}">
            {% csrf_token %}

            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="title">Welcome Back</span>
                <a href="{% url 'index' %}">
                    <i class="fa-regular fa-circle-xmark"></i>
                </a>
            </div>

            <div class="input-group-custom">
                <input type="text" name="username" placeholder="Username" required>
                <input type="hidden" name="next" value="{{ next }}">
            </div>

            <div class="input-group-custom password-wrapper">
                <input type="password" name="password" placeholder="Password" required>
                <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember_me" id="remember">
                    <label class="form-check-label" for="remember">Remember Me</label>
                </div>
                <a href="{% url 'password_reset' %}">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>

            <p class="text-center mt-3">
                Don't have an account?
                <a href="{% url 'register' %}">Sign Up</a>
            </p>

            <div class="row mt-4 g-2">
                <div class="col-4">
                    <a class="social-btn google"><i class="fa-brands fa-google"></i></a>
                </div>
                <div class="col-4">
                    <a class="social-btn github"><i class="fa-brands fa-github"></i></a>
                </div>
                <div class="col-4">
                    <a class="social-btn facebook"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
            </div>

            <p class="text-center mt-4 text-muted" style="font-size: 12px;">
                © 2026 MyShop. All rights reserved by Ruma Mahato
            </p>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Alertify -->
<script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>

{% if messages %}
{% for message in messages %}
<script>
    alertify.set('notifier','position','top-right');
    alertify.error("{{ message }}");
</script>
{% endfor %}
{% endif %}

<script>
    const passwordInput = document.querySelector('input[name="password"]');
    const toggle = document.getElementById('togglePassword');

    toggle.addEventListener('click', () => {
        passwordInput.type =
            passwordInput.type === 'password' ? 'text' : 'password';
        toggle.classList.toggle('fa-eye');
        toggle.classList.toggle('fa-eye-slash');
    });
</script>

</body>
</html>
